services:
  - type: web
    name: invoice-desk
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_DAILY_CAP
        value: "200"
